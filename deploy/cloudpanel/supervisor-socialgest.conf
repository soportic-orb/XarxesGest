; Supervisor programs for XarxesGest on CloudPanel.
; Copy to /etc/supervisor/conf.d/socialgest.conf, replace SITE_USER, then:
;   supervisorctl reread && supervisorctl update
; SITE_USER is the CloudPanel site user (owner of /home/SITE_USER/htdocs/socialgest.soportic.es).

[program:xarxesgest-horizon]
command=/usr/bin/php8.4 /home/SITE_USER/htdocs/socialgest.soportic.es/artisan horizon
directory=/home/SITE_USER/htdocs/socialgest.soportic.es
user=SITE_USER
autostart=true
autorestart=true
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/SITE_USER/logs/xarxesgest-horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:xarxesgest-reverb]
command=/usr/bin/php8.4 /home/SITE_USER/htdocs/socialgest.soportic.es/artisan reverb:start --host=127.0.0.1 --port=8090
directory=/home/SITE_USER/htdocs/socialgest.soportic.es
user=SITE_USER
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/SITE_USER/logs/xarxesgest-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
