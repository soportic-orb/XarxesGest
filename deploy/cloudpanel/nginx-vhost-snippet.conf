# Changes to the CloudPanel "Laravel" vhost of socialgest.soportic.es.
# Edit it in CloudPanel (Sites → socialgest.soportic.es → Vhost), never the file
# under /etc/nginx: CloudPanel regenerates it from what the panel stores.
#
# The template has two server blocks: the public one (listen 80/443) proxies
# everything to the internal one (listen 8080), which runs PHP. That is why
# Reverb listens on 8090.

# ---------------------------------------------------------------------------
# 1) Public block (listen 443), ABOVE `location / {`
# ---------------------------------------------------------------------------

  # Reverb (websockets)
  location /app {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:8090;
  }

  # Large uploads (Reel videos). Keep in line with MEDIA_VIDEO_MAX_SIZE_MB and
  # PHP's upload_max_filesize / post_max_size (Sites → PHP Settings).
  client_max_body_size 1024m;

# ---------------------------------------------------------------------------
# 2) Public block, inside `location / {`, after the X-Forwarded-For line
# ---------------------------------------------------------------------------

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

# ---------------------------------------------------------------------------
# 3) Internal block (listen 8080), right after the two `listen 8080` lines
# ---------------------------------------------------------------------------

  client_max_body_size 1024m;
