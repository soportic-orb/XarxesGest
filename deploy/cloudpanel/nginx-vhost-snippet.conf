# Add inside the `server { listen 443 ... }` block of the site's vhost in
# CloudPanel (Sites → xarxesgest.soportic.es → Vhost), ABOVE `location / {`.
# Proxies the Reverb WebSocket server (supervisor program xarxesgest-reverb).

location /app {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:8080;
}

# Large media uploads (videos for Reels). Keep in line with MEDIA_VIDEO_MAX_SIZE_MB
# and PHP's upload_max_filesize / post_max_size in CloudPanel's PHP settings.
client_max_body_size 1024m;
